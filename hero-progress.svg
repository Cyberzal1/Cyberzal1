<svg width="840" height="330" viewBox="0 0 840 330"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Hero's Progress Log: live GitHub stats for cyberzal1">
  <defs>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb2acf"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#bb2acf"/>
    </linearGradient>
  </defs>
  <style>
    .fill { transform-box: fill-box; transform-origin: left center;
             animation: xpfill 1.6s cubic-bezier(.2,.8,.2,1) .3s both; }
    .dot  { animation: pulse 2s ease-in-out infinite; }
    .scan { animation: sweep 9s linear infinite; }
    @keyframes xpfill { from { transform: scaleX(0); } }
    @keyframes pulse  { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    @keyframes sweep  { from { transform: translateY(-10px) }
                         to   { transform: translateY(340px) } }
    @media (prefers-reduced-motion: reduce) {
      .fill, .dot, .scan { animation: none; }
    }
  </style>

  <rect width="840" height="330" rx="12" fill="#0d1117" stroke="#1e2836"/>

  <!-- header -->
  <text x="32" y="40" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3"
        fill="#7d8590"><tspan fill="#bb2acf">//</tspan> HERO'S PROGRESS LOG</text>
  <circle class="dot" cx="676" cy="36" r="4" fill="#22c55e"/>
  <text x="688" y="40" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2"
        fill="#22d3ee">STATUS: ONLINE</text>
  <line x1="32" y1="58" x2="808" y2="58" stroke="#1e2836"/>

  <!-- identity -->
  <text x="32" y="106" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="27" font-weight="800"
        letter-spacing="1" fill="url(#name)">CYBERZAL</text>
  <text x="32" y="128" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2"
        fill="#7d8590">CLASS · CYBER SECURITY OPS</text>

  <!-- level + XP -->
  <text x="32" y="180" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700"
        fill="#bb2acf">LV</text>
  <text x="56" y="180" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="36" font-weight="800"
        fill="#bb2acf">9</text>
  <text x="368" y="178" text-anchor="end" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#7d8590">94 / 100 XP</text>
  <rect x="32" y="190" width="336" height="10" rx="5" fill="#131a24"
        stroke="#1e2836"/>
  <rect class="fill" x="32" y="190" width="229.9" height="10" rx="5"
        fill="url(#xp)"/>
  <text x="32" y="216" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="1"
        fill="#7d8590">6 XP TO LEVEL 10</text>
  <text x="32" y="240" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="1"
        fill="#7d8590">ACTIVE 19 DAYS · AUG '25 – AUG '26</text>

  <!-- stat grid -->
  <g transform="translate(420,84)">
    <rect width="124" height="84" rx="8" fill="#131a24" stroke="#1e2836"/>
    <text x="62" y="38" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="26" font-weight="700" fill="#e6edf3">94</text>
    <text x="62" y="56" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#22d3ee">YEAR XP</text>
    <text x="62" y="71" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="8" letter-spacing="0.5" fill="#7d8590">PAST-YEAR CONTRIBS</text>
  </g>
  <g transform="translate(552,84)">
    <rect width="124" height="84" rx="8" fill="#131a24" stroke="#1e2836"/>
    <text x="62" y="38" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="26" font-weight="700" fill="#e6edf3">47</text>
    <text x="62" y="56" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#22d3ee">2026 XP</text>
    <text x="62" y="71" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="8" letter-spacing="0.5" fill="#7d8590">YTD CONTRIBS</text>
  </g>
  <g transform="translate(684,84)">
    <rect width="124" height="84" rx="8" fill="#131a24" stroke="#1e2836"/>
    <text x="62" y="38" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="26" font-weight="700" fill="#e6edf3">13</text>
    <text x="62" y="56" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#22d3ee">QUESTS</text>
    <text x="62" y="71" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="8" letter-spacing="0.5" fill="#7d8590">PUBLIC REPOS</text>
  </g>
  <g transform="translate(420,178)">
    <rect width="124" height="84" rx="8" fill="#131a24" stroke="#1e2836"/>
    <text x="62" y="38" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="26" font-weight="700" fill="#e6edf3">3</text>
    <text x="62" y="56" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#22d3ee">COMBO</text>
    <text x="62" y="71" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="8" letter-spacing="0.5" fill="#7d8590">BEST STREAK · DAYS</text>
  </g>
  <g transform="translate(552,178)">
    <rect width="124" height="84" rx="8" fill="#131a24" stroke="#1e2836"/>
    <text x="62" y="38" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="26" font-weight="700" fill="#e6edf3">12</text>
    <text x="62" y="56" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#22d3ee">CRIT</text>
    <text x="62" y="71" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="8" letter-spacing="0.5" fill="#7d8590">BEST DAY · CONTRIBS</text>
  </g>
  <g transform="translate(684,178)">
    <rect width="124" height="84" rx="8" fill="#131a24" stroke="#1e2836"/>
    <text x="62" y="38" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="26" font-weight="700" fill="#e6edf3">6</text>
    <text x="62" y="56" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="10" letter-spacing="2" fill="#22d3ee">ALLIES</text>
    <text x="62" y="71" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace"
          font-size="8" letter-spacing="0.5" fill="#7d8590">FOLLOWERS</text>
  </g>

  <!-- quote -->
  <line x1="32" y1="272" x2="808" y2="272" stroke="#1e2836"/>
  <rect x="32" y="288" width="3" height="26" fill="#22d3ee"/>
  <text x="46" y="299" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="10.5" font-style="italic"
        fill="#7d8590">&#8220;Even if the odds are against me, as long as I hold the CyberShield,</text>
  <text x="46" y="313" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="10.5" font-style="italic"
        fill="#7d8590">I'll stand guard over the digital frontier.&#8221;</text>
  <text x="808" y="313" text-anchor="end" font-family="ui-monospace,'Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace" font-size="9"
        letter-spacing="1" fill="#7d8590">SYNCED 18 AUG 2026</text>

  <!-- signature scanline -->
  <rect class="scan" x="1" y="0" width="838" height="2" fill="#22d3ee"
        opacity="0.12"/>
</svg>
